<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fábrica de Tarjetas — Jugador</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh;
           display: flex; flex-direction: column; align-items: center; padding: 16px; }
    .branding { display:flex; align-items:center; gap:8px; margin-bottom:10px; opacity:0.75; }
    .branding img { height:20px; filter:brightness(0) invert(1); }
    .branding span { font-size:0.62rem; color:#666; letter-spacing:1px; text-transform:uppercase; }
    h1 { font-size: 1.3rem; color: #f0c040; text-align: center; margin-bottom: 4px; }
    .subtitle { font-size: 0.8rem; color: #aaa; margin-bottom: 20px; text-align: center; }
    .login-card { background: #16213e; border-radius: 12px; padding: 24px; width: 100%; max-width: 420px; }
    label { display: block; font-size: 0.78rem; color: #aaa; margin-bottom: 5px; }
    input, select { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid #333;
                    background: #0f3460; color: #fff; font-size: 0.95rem; margin-bottom: 14px; }
    button.primary { width: 100%; padding: 11px; border-radius: 8px; border: none;
                     background: #e94560; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
    #game-area { display: none; width: 100%; max-width: 480px; }
    .hud { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .stage-badge { background: #0f3460; border: 1px solid #e94560; border-radius: 20px;
                   padding: 3px 12px; font-size: 0.75rem; color: #f0c040; }
    .rol-chip { display: flex; align-items: center; gap: 6px; background: #0f3460;
                border-radius: 20px; padding: 3px 12px; font-size: 0.8rem; font-weight: 600; }
    .cdot { width: 14px; height: 14px; border-radius: 50%; }
    .metrics-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .metric { flex: 1; background: #0f3460; border-radius: 8px; padding: 8px; text-align: center; }
    .metric .val { font-size: 1.3rem; font-weight: 700; color: #f0c040; }
    .metric .lbl { font-size: 0.65rem; color: #aaa; }
    .lote-info { background: #0a1628; border-radius: 8px; padding: 8px 12px;
                 font-size: 0.78rem; color: #aaa; margin-bottom: 10px; }
    .lote-info b { color: #f0c040; }
    #status-msg { font-size: 0.85rem; color: #f0c040; text-align: center; min-height: 18px; margin: 6px 0; }
    #waiting-msg { text-align: center; color: #aaa; padding: 30px 10px; font-size: 0.9rem; line-height: 1.6; }

    /* ── Botón ENVIAR A SALIDA ── */
    .btn-enviar-salida { width: 100%; padding: 14px; border-radius: 10px; border: none;
                    background: linear-gradient(135deg,#1a8a3a,#0d6e2e); color: #fff;
                    font-size: 1.05rem; font-weight: 700; cursor: pointer; margin-bottom: 12px;
                    box-shadow: 0 3px 14px rgba(26,138,58,0.45); letter-spacing: 0.5px;
                    transition: transform 0.1s; }
    .btn-enviar-salida:active { transform: scale(0.97); }
    .btn-enviar-salida:disabled { background: #444; box-shadow: none; cursor: not-allowed; }

    /* Banner bandeja de salida */
    .salida-banner { background: #0d2518; border: 1px solid #1a8a3a55; border-radius: 8px;
                     padding: 8px 12px; margin-bottom: 10px; font-size: 0.78rem; color: #1a8a3a;
                     display: flex; align-items: center; gap: 8px; }
    .salida-banner .sal-count { font-size: 1.1rem; font-weight: 900; color: #28a745; }

    .paper-card { background: #fffef0; border-radius: 8px;
                  box-shadow: 2px 3px 12px rgba(0,0,0,0.5); padding: 12px 12px 8px;
                  margin-bottom: 12px; color: #222; user-select: none; }
    .paper-card.entregada-card { opacity: 0.45; }
    .card-header { display: flex; justify-content: space-between; align-items: center;
                   border-bottom: 1px solid #ccc; padding-bottom: 6px; margin-bottom: 8px; }
    .card-num  { font-size: 0.75rem; font-weight: 700; color: #444; }
    .card-logo { font-size: 0.62rem; color: #999; font-style: italic; }
    .card-estado { font-size: 0.68rem; font-weight: 700; padding: 2px 7px; border-radius: 10px; background: #eee; color: #666; }
    .card-estado.aprobada  { background: #d4edda; color: #155724; }
    .card-estado.revision  { background: #fff3cd; color: #856404; }
    .card-estado.rechazada { background: #f8d7da; color: #721c24; }
    .card-estado.entregada { background: #cce5ff; color: #004085; }
    .etiqueta-fila { display: flex; gap: 6px; margin-bottom: 6px; }
    .drop-zone { width: 52px; height: 28px; border-radius: 5px; border: 2px dashed #ccc;
                 background: #f5f5f0; display: flex; align-items: center; justify-content: center;
                 font-size: 0.58rem; color: #bbb; position: relative;
                 transition: border 0.2s, background 0.2s; flex-shrink: 0; }
    .drop-zone.mia  { cursor: pointer; }
    .drop-zone.over { border-color: #e94560; background: #fff0f3; }
    .drop-zone.filled { border-style: solid; border-color: transparent; background: transparent; }
    .etiqueta-pegada { width: 100%; height: 100%; border-radius: 4px; display: flex;
                       align-items: center; justify-content: center; font-size: 0.55rem;
                       font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.4); position: relative; }
    .score-badge { position: absolute; top: -7px; right: -7px; border-radius: 8px;
                   font-size: 0.48rem; padding: 1px 3px; font-weight: 700; color: #fff; }
    .score-badge.perfect { background: #28a745; }
    .score-badge.ok       { background: #d29922; }
    .score-badge.bad      { background: #e94560; }
    .drag-area { margin-top: 8px; border-top: 1px dashed #ccc; padding-top: 8px; }
    .da-label  { font-size: 0.68rem; color: #888; margin-bottom: 5px; text-align: center; }
    .draggable-etiqueta { width: 64px; height: 34px; border-radius: 6px; display: flex;
                          align-items: center; justify-content: center; font-size: 0.65rem;
                          font-weight: 700; color: #fff; cursor: grab; margin: 0 auto;
                          box-shadow: 0 2px 8px rgba(0,0,0,0.3); touch-action: none;
                          text-shadow: 0 1px 2px rgba(0,0,0,0.4); }
    #drag-ghost { position: fixed; pointer-events: none; z-index: 9999; width: 58px; height: 30px;
                  border-radius: 5px; display: none; align-items: center; justify-content: center;
                  font-size: 0.6rem; font-weight: 700; color: #fff; opacity: 0.88;
                  transform: translate(-50%,-50%); }
    .footer-brand { text-align:center; margin-top:24px; opacity:0.4; }
    .footer-brand img { height:16px; filter:brightness(0) invert(1); }
  </style>
</head>
<body>
  <div class="branding">
    <img src="https://www.largotek.com/web/image/website/2/logo/www.largotek.com?unique=d82f80f" alt="Largotek">
    <span>Largotek SRL</span>
  </div>
  <h1>🏭 Fábrica de Tarjetas</h1>
  <p class="subtitle">Unión Agronegocios — Lean White Belt</p>

  <div class="login-card" id="login-area">
    <label>Código de Sesión</label>
    <input type="text" id="inp-sesion" placeholder="Ej: LSS2026" maxlength="12">
    <label>Número de Equipo</label>
    <select id="inp-equipo">
      <option value="">-- Tu equipo --</option>
      <option value="1">Equipo 1</option><option value="2">Equipo 2</option>
      <option value="3">Equipo 3</option><option value="4">Equipo 4</option>
      <option value="5">Equipo 5</option><option value="6">Equipo 6</option>
    </select>
    <label>Tu Rol</label>
    <select id="inp-rol">
      <option value="">-- Tu rol --</option>
      <option value="amarillo">🟡 Amarillo (2 etiquetas/tarjeta)</option>
      <option value="naranja">🟠 Naranja (1 etiqueta/tarjeta)</option>
      <option value="rojo">🔴 Rojo (3 etiquetas/tarjeta)</option>
      <option value="verde">🟢 Verde (2 etiquetas/tarjeta)</option>
    </select>
    <label>Tu nombre</label>
    <input type="text" id="inp-nombre" placeholder="Ej: Juan" maxlength="20">
    <button class="primary" onclick="entrar()">Entrar al juego</button>
    <p style="margin-top:12px;font-size:0.72rem;color:#555;text-align:center">
      ¿Eres materialista? <a href="materialista.html" style="color:#17a2b8">→ Tu página</a> &nbsp;|
      ¿Inspector? <a href="calidad.html" style="color:#6f42c1">→ Tu página</a>
    </p>
  </div>

  <div id="game-area">
    <div class="hud">
      <div class="stage-badge" id="stage-info">Etapa 1</div>
      <div class="rol-chip"><div class="cdot" id="color-dot"></div><span id="rol-nombre">—</span></div>
      <span style="margin-left:auto;font-size:0.72rem;color:#888" id="equipo-display"></span>
    </div>
    <div class="lote-info" id="lote-info">Cargando...</div>
    <div class="metrics-row">
      <div class="metric"><div class="val" id="m-entregadas">0</div><div class="lbl">Entregadas</div></div>
      <div class="metric"><div class="val" id="m-wip">0</div><div class="lbl">WIP</div></div>
      <div class="metric"><div class="val" id="m-defectos">0</div><div class="lbl">Defectos</div></div>
    </div>
    <div id="status-msg"></div>
    <div id="tarjetas-container"><div id="waiting-msg">⏳ Esperando inicio de etapa...</div></div>
  </div>

  <div class="footer-brand"><img src="https://www.largotek.com/web/image/website/2/logo/www.largotek.com?unique=d82f80f" alt="Largotek"></div>
  <div id="drag-ghost"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getDatabase, ref, set, onValue, update, get } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBJN55Mv4YCb2LKvQxrMU_lptAN6BCCx1c",
      authDomain: "union-agronegocios-lean.firebaseapp.com",
      databaseURL: "https://union-agronegocios-lean-default-rtdb.firebaseio.com",
      projectId: "union-agronegocios-lean",
      storageBucket: "union-agronegocios-lean.firebasestorage.app",
      messagingSenderId: "181432386406",
      appId: "1:181432386406:web:6804ed3af0e343cdc2bea7"
    };
    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);

    const COLORES = { amarillo:'#f5c518', naranja:'#e07800', rojo:'#e94560', verde:'#1a8a3a' };
    const POSICIONES = [
      { id:'a1', color:'amarillo', row:0 }, { id:'a2', color:'amarillo', row:0 },
      { id:'n1', color:'naranja',  row:0 }, { id:'r1', color:'rojo',     row:0 },
      { id:'r2', color:'rojo',     row:1 }, { id:'r3', color:'rojo',     row:1 },
      { id:'v1', color:'verde',    row:1 }, { id:'v2', color:'verde',    row:1 },
    ];
    const ORDEN_TURNOS = ['amarillo','naranja','rojo','verde'];
    const LOTE_CONFIG = {
      1: { nombre:'Etapa 1 — Libre', desc:'Fabrica y presiona <b>Enviar a Salida</b> cuando quieras. El materialista mueve las cajas.' },
      2: { nombre:'Etapa 2 — Lote de 2', desc:'Trabaja de <b>2 en 2</b> y envía el par a tu bandeja de salida.' },
      3: { nombre:'Etapa 3 — Flujo unitario', desc:'Envía <b>tarjeta por tarjeta</b> a tu salida de inmediato.' }
    };

    const UMBRAL_OK       = 10;
    const UMBRAL_MARGINAL = 22;
    const SCORE_PERFECTO  = 95;
    const SCORE_MARGINAL  = 70;
    const BANDEJA = 4;

    let sesion, equipo, rol, nombre, etapaActual=1, tarjetasListener=null, tarjetasData={};

    function scoreVisible()     { return etapaActual >= 3; }
    function precisionVisible() { return etapaActual >= 3; }

    window.entrar = function() {
      sesion = document.getElementById('inp-sesion').value.trim().toUpperCase();
      equipo = document.getElementById('inp-equipo').value;
      rol    = document.getElementById('inp-rol').value;
      nombre = document.getElementById('inp-nombre').value.trim() || rol;
      if (!sesion||!equipo||!rol) { alert('Completa todos los campos.'); return; }
      document.getElementById('login-area').style.display = 'none';
      document.getElementById('game-area').style.display  = 'block';
      document.getElementById('color-dot').style.background = COLORES[rol]||'#888';
      document.getElementById('rol-nombre').textContent = nombre;
      document.getElementById('equipo-display').textContent = 'Equipo ' + equipo;
      set(ref(db,`sesiones/${sesion}/equipos/${equipo}/jugadores/${rol}`), { nombre, rol, online:true });
      onValue(ref(db,`sesiones/${sesion}/etapaActiva`), snap => {
        etapaActual = snap.val()||1;
        actualizarHUD(); escucharTarjetas();
      });
      onValue(ref(db,`sesiones/${sesion}/equipos/${equipo}/metricas`), snap => {
        const m=snap.val()||{};
        document.getElementById('m-entregadas').textContent = m.entregadas||0;
        document.getElementById('m-wip').textContent        = m.wip||0;
        document.getElementById('m-defectos').textContent   = m.defectos||0;
      });
    };

    function actualizarHUD() {
      const cfg=LOTE_CONFIG[etapaActual]||LOTE_CONFIG[1];
      document.getElementById('stage-info').textContent = cfg.nombre;
      document.getElementById('lote-info').innerHTML    = cfg.desc;
    }

    function escucharTarjetas() {
      if (tarjetasListener) tarjetasListener();
      tarjetasListener = onValue(
        ref(db,`sesiones/${sesion}/equipos/${equipo}/etapas/${etapaActual}/tarjetas`),
        snap => { tarjetasData=snap.val()||{}; render(); }
      );
    }

    // El jugador puede trabajar si el anterior ya envió a su SALIDA
    // Campo: salida_{color} = timestamp cuando el jugador presionó "Enviar a Salida"
    // Amarillo no necesita esperar a nadie
    function anteriorEnvioSalida(t, miRol) {
      const idx = ORDEN_TURNOS.indexOf(miRol);
      if (idx <= 0) return true;
      const anterior = ORDEN_TURNOS[idx - 1];
      // El materialista movió la caja a mi bandeja de entrada
      return !!t[`entrada_${miRol}`];
    }

    function render() {
      const container = document.getElementById('tarjetas-container');
      const ids = Object.keys(tarjetasData);
      if (!ids.length) {
        container.innerHTML = '<div id="waiting-msg">⏳ Esperando que el instructor inicie la etapa...</div>';
        return;
      }

      const misPosiciones = POSICIONES.filter(p => p.color === rol);
      const todas = ids.sort((a,b) => (tarjetasData[a].numero||0)-(tarjetasData[b].numero||0));

      // Tarjetas en mi bandeja de ENTRADA (materialista me las trajo)
      // Amarillo: todas las tarjetas están disponibles desde el inicio (no necesita materialista)
      const enEntrada = todas.filter(id => {
        const t = tarjetasData[id];
        if (t[`salida_${rol}`]) return false; // ya la envié a salida
        if (rol === 'amarillo') return !t[`salida_amarillo`];
        return !!t[`entrada_${rol}`] && !t[`salida_${rol}`];
      });

      // Tarjetas en mi bandeja de SALIDA (ya procesé y envié, esperando materialista)
      const enSalida = todas.filter(id => {
        const t = tarjetasData[id];
        return !!t[`salida_${rol}`] && !t[`entrada_${ORDEN_TURNOS[ORDEN_TURNOS.indexOf(rol)+1]}`];
      }).filter(id => ORDEN_TURNOS.indexOf(rol) < ORDEN_TURNOS.length - 1); // verde no tiene siguiente

      // Listas para enviar a salida (tienen mis etiquetas completas)
      const listasParaSalida = enEntrada.filter(id =>
        misPosiciones.every(p => tarjetasData[id][p.id] !== undefined)
      );

      // En fabricación (en entrada pero sin etiquetas completas)
      const enFabricacion = enEntrada
        .filter(id => misPosiciones.some(p => tarjetasData[id][p.id] === undefined))
        .slice(0, BANDEJA);

      if (!enEntrada.length && !enSalida.length) {
        container.innerHTML = '<div id="waiting-msg">✅ Todas tus tarjetas procesadas esta etapa.</div>';
        return;
      }

      let html = '';

      // ── Botón Enviar a Salida ──
      const puedoEnviar = listasParaSalida.length > 0;
      html += `<button class="btn-enviar-salida" onclick="enviarASalida()" ${puedoEnviar?'':'disabled'}>
        📤 ENVIAR A SALIDA${puedoEnviar ? ` (${listasParaSalida.length} tarjeta${listasParaSalida.length>1?'s':''})` : ' — termina de pegar etiquetas'}
      </button>`;

      // ── Banner bandeja de salida ──
      if (enSalida.length > 0) {
        html += `<div class="salida-banner">
          📤 Bandeja de Salida — <span class="sal-count">${enSalida.length}</span>&nbsp;tarjeta${enSalida.length>1?'s':''} esperando al materialista
        </div>`;
      }

      // ── Tarjetas listas para enviar ──
      if (listasParaSalida.length) {
        html += `<div style="font-size:0.7rem;color:#28a745;margin-bottom:6px">✅ Listas para enviar a salida</div>`;
        html += listasParaSalida.map(id => renderTarjeta(id, tarjetasData[id], true)).join('');
      }

      // ── En fabricación ──
      if (enFabricacion.length) {
        html += `<div style="font-size:0.7rem;color:#aaa;margin-bottom:6px;margin-top:4px">🔧 En fabricación</div>`;
        html += enFabricacion.map(id => renderTarjeta(id, tarjetasData[id], true)).join('');
      }

      // ── Esperando materialista (si no hay nada en entrada) ──
      if (!enEntrada.length && rol !== 'amarillo') {
        html += `<div id="waiting-msg" style="padding:20px 0">⏳ Esperando que el materialista traiga tarjetas a tu bandeja de entrada...</div>`;
      }

      container.innerHTML = html;
      setupDropZones();
    }

    function renderTarjeta(id, t, puedo) {
      const misPosiciones = POSICIONES.filter(p => p.color === rol);
      const yaEnvie = !!t[`salida_${rol}`];
      const todasLlenas = POSICIONES.every(p => t[p.id] !== undefined);
      const estadoLabel = yaEnvie?'entregada':t.aprobada?'aprobada':t.rechazada?'rechazada':todasLlenas?'revision':'';
      const estadoTxt   = yaEnvie?'📤 En salida':t.aprobada?'✅ Aprobada':t.rechazada?'❌ Defecto':todasLlenas?'🔍 Revisión':'';
      const mostrarScore = scoreVisible();
      const filas = [0,1].map(row => {
        const zonas = POSICIONES.filter(p => p.row === row).map(pos => {
          const pegada = t[pos.id];
          if (pegada !== undefined) {
            const s = pegada.score||0;
            const sc = s>=SCORE_PERFECTO?'perfect':s>=SCORE_MARGINAL?'ok':'bad';
            const scoreBadge = mostrarScore?`<span class="score-badge ${sc}">${s}%</span>`:'';
            return `<div class="drop-zone filled"><div class="etiqueta-pegada" style="background:${COLORES[pos.color]}">${(pegada.nombre||pos.color).substring(0,3).toUpperCase()}${scoreBadge}</div></div>`;
          }
          const esMio = pos.color===rol && puedo && !yaEnvie;
          return `<div class="drop-zone${esMio?' mia':''}" data-pos="${pos.id}" data-tid="${id}" style="${esMio?'border-color:'+COLORES[rol]+';':''}">${esMio?'<span style="color:'+COLORES[rol]+';font-size:0.55rem">drop</span>':''}</div>`;
        }).join('');
        return `<div class="etiqueta-fila">${zonas}</div>`;
      }).join('');
      const meFalta = misPosiciones.some(p => t[p.id] === undefined);
      const dragHtml = meFalta && puedo && !yaEnvie
        ? `<div class="drag-area"><div class="da-label">Arrastra tu etiqueta ↓</div><div class="draggable-etiqueta" style="background:${COLORES[rol]}" draggable="true" data-tid="${id}" ontouchstart="touchStart(event)" ontouchmove="touchMove(event)" ontouchend="touchEnd(event)">${nombre.substring(0,4).toUpperCase()}</div></div>`
        : '';
      return `<div class="paper-card${yaEnvie?' entregada-card':''}" id="pc-${id}"><div class="card-header"><span class="card-num">TARJETA #${t.numero}</span><span class="card-logo">UA Lean</span>${estadoLabel?`<span class="card-estado ${estadoLabel}">${estadoTxt}</span>`:''}</div>${filas}${dragHtml}</div>`;
    }

    // Jugador presiona "Enviar a Salida" — escribe salida_{rol} en Firebase
    window.enviarASalida = async function() {
      const ids = Object.keys(tarjetasData);
      const misPosiciones = POSICIONES.filter(p => p.color === rol);
      const aEnviar = ids.filter(id => {
        const t = tarjetasData[id];
        const enEntrada = rol === 'amarillo' ? !t[`salida_amarillo`] : !!t[`entrada_${rol}`] && !t[`salida_${rol}`];
        return enEntrada && misPosiciones.every(p => t[p.id] !== undefined);
      }).sort((a,b) => (tarjetasData[a].numero||0)-(tarjetasData[b].numero||0));
      if (!aEnviar.length) return;
      const ts = Date.now();
      const updates = {};
      aEnviar.forEach(id => {
        updates[`sesiones/${sesion}/equipos/${equipo}/etapas/${etapaActual}/tarjetas/${id}/salida_${rol}`] = ts;
        // Compatibilidad con instructor: también escribir entregado_{rol}
        updates[`sesiones/${sesion}/equipos/${equipo}/etapas/${etapaActual}/tarjetas/${id}/entregado_${rol}`] = ts;
      });
      // Amarillo: actualizar WIP
      const snap = await get(ref(db,`sesiones/${sesion}/equipos/${equipo}/metricas/wip`));
      updates[`sesiones/${sesion}/equipos/${equipo}/metricas/wip`] = (snap.val()||0) + aEnviar.length;
      await update(ref(db), updates);
      setStatus(`📤 ${aEnviar.length} tarjeta${aEnviar.length>1?'s':''} enviada${aEnviar.length>1?'s':''} a tu bandeja de salida ✅`);
    };

    let dragTid = null;
    function setupDropZones() {
      document.querySelectorAll('.draggable-etiqueta').forEach(el => {
        el.addEventListener('dragstart', e => { dragTid=el.dataset.tid; e.dataTransfer.effectAllowed='move'; });
      });
      document.querySelectorAll('.drop-zone.mia').forEach(zone => {
        zone.addEventListener('dragover',  e => { e.preventDefault(); zone.classList.add('over'); });
        zone.addEventListener('dragleave', () => zone.classList.remove('over'));
        zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('over'); pegarEtiqueta(zone.dataset.tid, zone.dataset.pos, e.clientX, e.clientY, zone); });
      });
    }

    const ghost = document.getElementById('drag-ghost');
    window.touchStart = function(e) { dragTid=e.currentTarget.dataset.tid; ghost.style.background=COLORES[rol]; ghost.textContent=nombre.substring(0,4).toUpperCase(); ghost.style.display='flex'; };
    window.touchMove  = function(e) { e.preventDefault(); const t=e.touches[0]; ghost.style.left=t.clientX+'px'; ghost.style.top=t.clientY+'px'; document.querySelectorAll('.drop-zone.over').forEach(z=>z.classList.remove('over')); document.elementFromPoint(t.clientX,t.clientY)?.closest('.drop-zone.mia')?.classList.add('over'); };
    window.touchEnd   = function(e) { ghost.style.display='none'; const t=e.changedTouches[0]; document.querySelectorAll('.drop-zone.over').forEach(z=>z.classList.remove('over')); const zone=document.elementFromPoint(t.clientX,t.clientY)?.closest('.drop-zone.mia'); if(zone) pegarEtiqueta(zone.dataset.tid, zone.dataset.pos, t.clientX, t.clientY, zone); };

    async function pegarEtiqueta(tarjetaId, posId, dropX, dropY, zoneEl) {
      const rect = zoneEl.getBoundingClientRect();
      const dist = Math.sqrt((dropX-rect.left-rect.width/2)**2+(dropY-rect.top-rect.height/2)**2);
      let score;
      if (dist<=UMBRAL_OK) score=Math.round(100-(dist/UMBRAL_OK)*5);
      else if (dist<=UMBRAL_MARGINAL) score=Math.round(95-((dist-UMBRAL_OK)/(UMBRAL_MARGINAL-UMBRAL_OK))*25);
      else score=Math.max(0,Math.round(70-((dist-UMBRAL_MARGINAL)/18)*70));
      const path=`sesiones/${sesion}/equipos/${equipo}/etapas/${etapaActual}/tarjetas/${tarjetaId}`;
      await update(ref(db),{[`${path}/${posId}`]:{score,nombre,rol,ts:Date.now()}});
      if (precisionVisible()) setStatus(`${score>=SCORE_PERFECTO?'🎯':score>=SCORE_MARGINAL?'⚠️':'💥'} Precisión: ${score}%`);
      else setStatus('✅ Etiqueta pegada');
    }

    function setStatus(msg) { document.getElementById('status-msg').textContent=msg; setTimeout(()=>document.getElementById('status-msg').textContent='',3000); }
  </script>
</body>
</html>
