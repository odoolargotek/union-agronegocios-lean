<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Inspector de Calidad — Fábrica de Tarjetas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #eee;
           min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }
    .branding { display:flex; align-items:center; gap:8px; margin-bottom:10px; opacity:0.75; }
    .branding img { height:20px; filter:brightness(0) invert(1); }
    .branding span { font-size:0.62rem; color:#666; letter-spacing:1px; text-transform:uppercase; }
    h1 { font-size: 1.2rem; color: #6f42c1; text-align: center; margin-bottom: 4px; }
    .subtitle { font-size: 0.78rem; color: #aaa; margin-bottom: 20px; text-align: center; }
    .login-card { background: #161b22; border-radius: 12px; padding: 24px; width: 100%; max-width: 400px; }
    label { display: block; font-size: 0.78rem; color: #aaa; margin-bottom: 5px; }
    input, select { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid #30363d;
                    background: #0d1117; color: #fff; font-size: 0.95rem; margin-bottom: 14px; }
    button.primary { width: 100%; padding: 11px; border-radius: 8px; border: none;
                     background: #6f42c1; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
    #game-area { display: none; width: 100%; max-width: 480px; }
    .hud { display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
    .stage-badge { background:#161b22; border:1px solid #6f42c1; border-radius:20px;
                   padding:3px 12px; font-size:0.75rem; color:#6f42c1; }
    .equipo-chip { background:#161b22; border-radius:20px; padding:3px 12px; font-size:0.78rem; color:#aaa; }
    .metrics-row { display:flex; gap:8px; margin-bottom:12px; }
    .metric { flex:1; background:#161b22; border-radius:8px; padding:8px; text-align:center; }
    .metric .val { font-size:1.3rem; font-weight:700; color:#f0c040; }
    .metric .lbl { font-size:0.65rem; color:#888; }
    #status-msg { font-size:0.85rem; color:#6f42c1; text-align:center; min-height:18px; margin:4px 0 10px; }
    .insp-card { background:#fffef0; border-radius:10px; padding:14px; margin-bottom:12px;
                 color:#222; box-shadow:2px 3px 12px rgba(0,0,0,0.5); }
    .insp-header { display:flex; justify-content:space-between; align-items:center;
                   border-bottom:1px solid #ccc; padding-bottom:8px; margin-bottom:10px; flex-wrap:wrap; gap:6px; }
    .insp-num { font-size:0.85rem; font-weight:700; color:#333; }
    .insp-equipo { font-size:0.68rem; color:#888; }
    .pos-grid { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
    .pos-item { display:flex; flex-direction:column; align-items:center; gap:2px; }
    .pos-dot { width:44px; height:28px; border-radius:5px; display:flex; align-items:center;
               justify-content:center; font-size:0.6rem; font-weight:700; color:#fff;
               text-shadow:0 1px 2px rgba(0,0,0,0.5); }
    .pos-score { font-size:0.6rem; font-weight:700; }
    .pos-empty { background:#ddd; color:#999; font-size:0.55rem; }
    .score-display { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
    .score-big { font-size:2rem; font-weight:900; }
    .score-bar-wrap { flex:1; }
    .score-bar-bg { background:#eee; border-radius:4px; height:8px; }
    .score-bar-fill { height:8px; border-radius:4px; transition:width 0.3s; }
    .score-label { font-size:0.68rem; color:#888; margin-top:3px; }
    .decision-btns { display:flex; gap:10px; }
    .btn-aprobar { flex:1; padding:12px; border-radius:8px; border:none; background:#28a745;
                   color:#fff; font-size:1rem; font-weight:700; cursor:pointer; }
    .btn-rechazar { flex:1; padding:12px; border-radius:8px; border:none; background:#e94560;
                    color:#fff; font-size:1rem; font-weight:700; cursor:pointer; }
    .badge-aprobada { display:inline-block; background:#d4edda; color:#155724; border-radius:8px;
                      padding:4px 12px; font-size:0.78rem; font-weight:700; }
    .badge-rechazada { display:inline-block; background:#f8d7da; color:#721c24; border-radius:8px;
                       padding:4px 12px; font-size:0.78rem; font-weight:700; }
    #waiting-msg { text-align:center; color:#aaa; padding:30px 10px; font-size:0.9rem; line-height:1.6; }
    .footer-brand { text-align:center; margin-top:24px; opacity:0.4; }
    .footer-brand img { height:14px; filter:brightness(0) invert(1); }
    .c-amarillo { background:#f5c518; }
    .c-naranja  { background:#e07800; }
    .c-rojo     { background:#e94560; }
    .c-verde    { background:#1a8a3a; }
  </style>
</head>
<body>
  <div class="branding">
    <img src="https://www.largotek.com/web/image/website/2/logo/www.largotek.com?unique=d82f80f" alt="Largotek">
    <span>Largotek SRL</span>
  </div>
  <h1>🔍 Inspector de Calidad</h1>
  <p class="subtitle">Unión Agronegocios — Lean White Belt</p>

  <div class="login-card" id="login-area">
    <label>Código de Sesión</label>
    <input type="text" id="inp-sesion" placeholder="Ej: LSS2026" maxlength="12">
    <label>Número de Equipo</label>
    <select id="inp-equipo">
      <option value="">-- Tu equipo --</option>
      <option value="1">Equipo 1</option><option value="2">Equipo 2</option>
      <option value="3">Equipo 3</option><option value="4">Equipo 4</option>
      <option value="5">Equipo 5</option><option value="6">Equipo 6</option>
    </select>
    <label>Tu nombre</label>
    <input type="text" id="inp-nombre" placeholder="Ej: Carlos" maxlength="20">
    <button class="primary" onclick="entrar()">Entrar como Inspector</button>
  </div>

  <div id="game-area">
    <div class="hud">
      <div class="stage-badge" id="stage-badge">Etapa 1</div>
      <div class="equipo-chip" id="equipo-chip">Equipo —</div>
    </div>
    <div class="metrics-row">
      <div class="metric"><div class="val" id="m-aprobadas">0</div><div class="lbl">Aprobadas</div></div>
      <div class="metric"><div class="val" id="m-rechazadas">0</div><div class="lbl">Defectos</div></div>
      <div class="metric"><div class="val" id="m-pendientes">0</div><div class="lbl">En cola</div></div>
    </div>
    <div id="status-msg"></div>
    <div id="tarjetas-container"><div id="waiting-msg">🔍 Esperando tarjetas terminadas...</div></div>
  </div>

  <div class="footer-brand"><img src="https://www.largotek.com/web/image/website/2/logo/www.largotek.com?unique=d82f80f" alt="Largotek"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getDatabase, ref, set, onValue, update, get } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBJN55Mv4YCb2LKvQxrMU_lptAN6BCCx1c",
      authDomain: "union-agronegocios-lean.firebaseapp.com",
      databaseURL: "https://union-agronegocios-lean-default-rtdb.firebaseio.com",
      projectId: "union-agronegocios-lean",
      storageBucket: "union-agronegocios-lean.firebasestorage.app",
      messagingSenderId: "181432386406",
      appId: "1:181432386406:web:6804ed3af0e343cdc2bea7"
    };
    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);

    const POSICIONES = [
      {id:'a1',color:'amarillo',row:0},{id:'a2',color:'amarillo',row:0},
      {id:'n1',color:'naranja', row:0},{id:'r1',color:'rojo',    row:0},
      {id:'r2',color:'rojo',   row:1},{id:'r3',color:'rojo',    row:1},
      {id:'v1',color:'verde',  row:1},{id:'v2',color:'verde',   row:1},
    ];
    const COLORES = { amarillo:'#f5c518', naranja:'#e07800', rojo:'#e94560', verde:'#1a8a3a' };

    // ── UMBRALES DE CALIFICACIÓN (deben coincidir con dinamica-tarjetas.html) ──
    const SCORE_PERFECTO = 95;  // antes 85
    const SCORE_MARGINAL = 70;  // antes 60

    let sesion, equipo, nombre, etapaActual=1, tarjetasData={};

    window.entrar = function() {
      sesion = document.getElementById('inp-sesion').value.trim().toUpperCase();
      equipo = document.getElementById('inp-equipo').value;
      nombre = document.getElementById('inp-nombre').value.trim() || 'Inspector';
      if (!sesion||!equipo) { alert('Completa todos los campos.'); return; }
      document.getElementById('login-area').style.display = 'none';
      document.getElementById('game-area').style.display  = 'block';
      document.getElementById('equipo-chip').textContent  = 'Equipo ' + equipo;
      set(ref(db,`sesiones/${sesion}/equipos/${equipo}/jugadores/calidad`), { nombre, rol:'calidad', online:true });
      onValue(ref(db,`sesiones/${sesion}/etapaActiva`), snap => {
        etapaActual = snap.val()||1;
        document.getElementById('stage-badge').textContent = 'Etapa ' + etapaActual;
        escuchar();
      });
      onValue(ref(db,`sesiones/${sesion}/equipos/${equipo}/metricas`), snap => {
        const m=snap.val()||{};
        document.getElementById('m-aprobadas').textContent  = m.entregadas||0;
        document.getElementById('m-rechazadas').textContent = m.defectos||0;
      });
    };

    let listener=null;
    function escuchar() {
      if (listener) listener();
      listener = onValue(
        ref(db,`sesiones/${sesion}/equipos/${equipo}/etapas/${etapaActual}/tarjetas`),
        snap => { tarjetasData=snap.val()||{}; render(); }
      );
    }

    function render() {
      const container = document.getElementById('tarjetas-container');
      const ids = Object.keys(tarjetasData);
      const enCola = ids.filter(id => {
        const t = tarjetasData[id];
        if (t.aprobada || t.rechazada) return false;
        if (etapaActual === 1) return !!t.entregado_materialista_calidad;
        return !!t.entregado_verde;
      }).sort((a,b)=>(tarjetasData[a].numero||0)-(tarjetasData[b].numero||0));

      document.getElementById('m-pendientes').textContent = enCola.length;

      if (!enCola.length) {
        container.innerHTML = '<div id="waiting-msg">🔍 Sin tarjetas en cola aún...</div>';
        return;
      }

      const html = enCola.map(id => {
        const t = tarjetasData[id];
        const scores = POSICIONES.map(p => ({ pos:p, data:t[p.id] }));
        const validos = scores.filter(s=>s.data?.score!==undefined).map(s=>s.data.score);
        const avg = validos.length ? Math.round(validos.reduce((a,b)=>a+b,0)/validos.length) : 0;
        const scoreColor = avg>=SCORE_PERFECTO?'#28a745':avg>=SCORE_MARGINAL?'#d29922':'#e94560';

        const posDots = POSICIONES.map(p => {
          const d = t[p.id];
          if (!d) return `<div class="pos-item"><div class="pos-dot pos-empty">—</div><div class="pos-score" style="color:#ccc">—</div></div>`;
          const s=d.score||0, sc=s>=SCORE_PERFECTO?'#28a745':s>=SCORE_MARGINAL?'#d29922':'#e94560';
          return `<div class="pos-item">
            <div class="pos-dot c-${p.color}">${(d.nombre||p.color).substring(0,3).toUpperCase()}</div>
            <div class="pos-score" style="color:${sc}">${s}%</div>
          </div>`;
        }).join('');

        const barW = Math.min(100, avg);
        return `<div class="insp-card">
          <div class="insp-header">
            <span class="insp-num">TARJETA #${t.numero}</span>
            <span class="insp-equipo">Equipo ${equipo}</span>
          </div>
          <div class="pos-grid">${posDots}</div>
          <div class="score-display">
            <div class="score-big" style="color:${scoreColor}">${avg}%</div>
            <div class="score-bar-wrap">
              <div class="score-bar-bg"><div class="score-bar-fill" style="width:${barW}%;background:${scoreColor}"></div></div>
              <div class="score-label">${avg>=SCORE_PERFECTO?'✅ Excelente':avg>=SCORE_MARGINAL?'⚠️ Marginal':'❌ Defecto — rechazar'}</div>
            </div>
          </div>
          <div class="decision-btns">
            <button class="btn-aprobar"  onclick="decidir('${id}',true,${avg})">✅ APROBAR</button>
            <button class="btn-rechazar" onclick="decidir('${id}',false,${avg})">❌ RECHAZAR</button>
          </div>
        </div>`;
      }).join('');

      container.innerHTML = html;
    }

    window.decidir = async function(tarjetaId, aprobada, score) {
      const path=`sesiones/${sesion}/equipos/${equipo}/etapas/${etapaActual}/tarjetas/${tarjetaId}`;
      const updates={[`${path}/aprobada`]:aprobada,[`${path}/rechazada`]:!aprobada,[`${path}/scorePromedio`]:score,[`${path}/tsDecision`]:Date.now()};
      const key=aprobada?'entregadas':'defectos';
      const snap=await get(ref(db,`sesiones/${sesion}/equipos/${equipo}/metricas/${key}`));
      updates[`sesiones/${sesion}/equipos/${equipo}/metricas/${key}`]=(snap.val()||0)+1;
      await update(ref(db),updates);
      setStatus(aprobada?`✅ Tarjeta #${tarjetasData[tarjetaId]?.numero} aprobada`:`❌ Defecto registrado`);
    };

    function setStatus(msg) {
      document.getElementById('status-msg').textContent=msg;
      setTimeout(()=>document.getElementById('status-msg').textContent='',3000);
    }
  </script>
</body>
</html>
