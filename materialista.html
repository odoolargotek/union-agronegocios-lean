<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Materialista — Fábrica de Tarjetas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #eee;
           min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }
    .branding { display:flex; align-items:center; gap:8px; margin-bottom:10px; opacity:0.75; }
    .branding img { height:20px; filter:brightness(0) invert(1); }
    .branding span { font-size:0.62rem; color:#666; letter-spacing:1px; text-transform:uppercase; }
    h1 { font-size: 1.2rem; color: #17a2b8; text-align: center; margin-bottom: 4px; }
    .subtitle { font-size: 0.78rem; color: #aaa; margin-bottom: 20px; text-align: center; }
    .login-card { background: #161b22; border-radius: 12px; padding: 24px; width: 100%; max-width: 400px; }
    label { display: block; font-size: 0.78rem; color: #aaa; margin-bottom: 5px; }
    input, select { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid #30363d;
                    background: #0d1117; color: #fff; font-size: 0.95rem; margin-bottom: 14px; }
    button.primary { width: 100%; padding: 11px; border-radius: 8px; border: none;
                     background: #17a2b8; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
    #game-area { display: none; width: 100%; max-width: 520px; }
    .hud { display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
    .stage-badge { background:#161b22; border:1px solid #17a2b8; border-radius:20px;
                   padding:3px 12px; font-size:0.75rem; color:#17a2b8; }
    .equipo-chip { background:#161b22; border-radius:20px; padding:3px 12px; font-size:0.78rem; color:#aaa; }
    #status-msg { font-size:0.85rem; color:#17a2b8; text-align:center; min-height:18px; margin:4px 0 10px; }
    /* Pipeline de zonas */
    .pipeline-wrap { width:100%; }
    .zona { background:#161b22; border-radius:10px; padding:12px; margin-bottom:10px;
            border:2px solid #30363d; min-height:90px; transition:border 0.2s, background 0.2s; }
    .zona.drop-over { border-color:#17a2b8; background:#0d2530; }
    .zona-header { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
    .zona-dot { width:12px; height:12px; border-radius:50%; flex-shrink:0; }
    .zona-title { font-size:0.82rem; font-weight:700; }
    .zona-count { margin-left:auto; font-size:0.7rem; background:#0d1117; border-radius:10px;
                  padding:2px 8px; color:#888; }
    .cajas-wrap { display:flex; flex-wrap:wrap; gap:8px; min-height:52px;
                  align-items:flex-start; }
    .caja-vacia { color:#444; font-size:0.72rem; align-self:center; }
    /* Caja draggable */
    .caja { width:64px; height:64px; border-radius:8px; display:flex; flex-direction:column;
            align-items:center; justify-content:center; cursor:grab; touch-action:none;
            box-shadow:0 3px 10px rgba(0,0,0,0.5); border:2px solid rgba(255,255,255,0.15);
            transition:transform 0.1s; user-select:none; position:relative; }
    .caja:active { transform:scale(0.95); }
    .caja-icon { font-size:1.4rem; line-height:1; }
    .caja-num  { font-size:0.6rem; font-weight:700; color:#fff; margin-top:3px;
                 text-shadow:0 1px 3px rgba(0,0,0,0.6); }
    .caja-ids  { font-size:0.5rem; color:rgba(255,255,255,0.6); text-align:center; }
    /* Ghost drag */
    #drag-ghost { position:fixed; pointer-events:none; z-index:9999; width:64px; height:64px;
                  border-radius:8px; display:none; align-items:center; justify-content:center;
                  flex-direction:column; font-size:1.4rem; opacity:0.85;
                  transform:translate(-50%,-50%); box-shadow:0 4px 16px rgba(0,0,0,0.6); }
    .footer-brand { text-align:center; margin-top:24px; opacity:0.4; }
    .footer-brand img { height:14px; filter:brightness(0) invert(1); }
  </style>
</head>
<body>
  <div class="branding">
    <img src="https://www.largotek.com/web/image/website/2/logo/www.largotek.com?unique=d82f80f" alt="Largotek">
    <span>Largotek SRL</span>
  </div>
  <h1>📦 Materialista</h1>
  <p class="subtitle">Mueve las cajas entre estaciones — Etapa 1</p>

  <div class="login-card" id="login-area">
    <label>Código de Sesión</label>
    <input type="text" id="inp-sesion" placeholder="Ej: LSS2026" maxlength="12">
    <label>Número de Equipo</label>
    <select id="inp-equipo">
      <option value="">-- Tu equipo --</option>
      <option value="1">Equipo 1</option><option value="2">Equipo 2</option>
      <option value="3">Equipo 3</option><option value="4">Equipo 4</option>
      <option value="5">Equipo 5</option><option value="6">Equipo 6</option>
    </select>
    <label>Tu nombre</label>
    <input type="text" id="inp-nombre" placeholder="Ej: María" maxlength="20">
    <button class="primary" onclick="entrar()">Entrar como Materialista</button>
  </div>

  <div id="game-area">
    <div class="hud">
      <div class="stage-badge" id="stage-badge">Etapa 1</div>
      <div class="equipo-chip" id="equipo-chip">Equipo —</div>
    </div>
    <div id="status-msg"></div>
    <div class="pipeline-wrap" id="pipeline"></div>
  </div>

  <div class="footer-brand"><img src="https://www.largotek.com/web/image/website/2/logo/www.largotek.com?unique=d82f80f" alt="Largotek"></div>
  <div id="drag-ghost"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getDatabase, ref, set, onValue, update, get } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBJN55Mv4YCb2LKvQxrMU_lptAN6BCCx1c",
      authDomain: "union-agronegocios-lean.firebaseapp.com",
      databaseURL: "https://union-agronegocios-lean-default-rtdb.firebaseio.com",
      projectId: "union-agronegocios-lean",
      storageBucket: "union-agronegocios-lean.firebasestorage.app",
      messagingSenderId: "181432386406",
      appId: "1:181432386406:web:6804ed3af0e343cdc2bea7"
    };
    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);

    // Pipeline: de dónde viene → a dónde va → color de caja
    const ZONAS = [
      { id:'cola_naranja',   label:'Cola Naranja',   color:'#e07800', dotColor:'#e07800',
        desde:'entregado_amarillo', hasta:'entregado_materialista_naranja',
        desc:'Entregado por Amarillo — mover a Naranja' },
      { id:'cola_rojo',      label:'Cola Rojo',      color:'#e94560', dotColor:'#e94560',
        desde:'entregado_materialista_naranja', hasta:'entregado_materialista_rojo',
        /* Naranja ya entregó, esperando Rojo */
        desde2:'entregado_naranja',
        desc:'Entregado por Naranja — mover a Rojo' },
      { id:'cola_verde',     label:'Cola Verde',     color:'#1a8a3a', dotColor:'#1a8a3a',
        desde:'entregado_rojo', hasta:'entregado_materialista_verde',
        desc:'Entregado por Rojo — mover a Verde' },
      { id:'cola_calidad',   label:'Cola Calidad',   color:'#6f42c1', dotColor:'#6f42c1',
        desde:'entregado_verde', hasta:'entregado_materialista_calidad',
        desc:'Terminado por Verde — mover a Calidad' },
    ];

    // Lotes agrupados: clave = timestamp de entrega del operario anterior
    // Una "caja" = conjunto de tarjetas entregadas en el mismo timestamp (o cercanas)

    let sesion, equipo, nombre;
    let etapaActual = 1;
    let tarjetasData = {};
    let dragCaja = null; // { zonaId, loteTs, ids }

    window.entrar = function() {
      sesion = document.getElementById('inp-sesion').value.trim().toUpperCase();
      equipo = document.getElementById('inp-equipo').value;
      nombre = document.getElementById('inp-nombre').value.trim() || 'Materialista';
      if (!sesion||!equipo) { alert('Completa todos los campos.'); return; }
      document.getElementById('login-area').style.display = 'none';
      document.getElementById('game-area').style.display  = 'block';
      document.getElementById('equipo-chip').textContent  = 'Equipo ' + equipo;
      set(ref(db,`sesiones/${sesion}/equipos/${equipo}/jugadores/materialista`), { nombre, rol:'materialista', online:true });
      onValue(ref(db,`sesiones/${sesion}/etapaActiva`), snap => {
        etapaActual = snap.val()||1;
        document.getElementById('stage-badge').textContent = 'Etapa ' + etapaActual;
        escucharTarjetas();
      });
    };

    let listener = null;
    function escucharTarjetas() {
      if (listener) listener();
      listener = onValue(
        ref(db,`sesiones/${sesion}/equipos/${equipo}/etapas/${etapaActual}/tarjetas`),
        snap => { tarjetasData = snap.val()||{}; render(); }
      );
    }

    // Agrupa tarjetas en "cajas" por timestamp de entrega del operario anterior
    // Tolerancia 2s para agrupar entregas casi simultáneas
    function agruparEnCajas(ids, campoDesde, campoHasta) {
      const pendientes = ids.filter(id => {
        const t = tarjetasData[id];
        return t[campoDesde] && !t[campoHasta];
      });
      if (!pendientes.length) return [];
      // Agrupar por ts del campoDesde con tolerancia 2000ms
      const grupos = [];
      const usados = new Set();
      pendientes.sort((a,b) => tarjetasData[a][campoDesde] - tarjetasData[b][campoDesde]);
      for (const id of pendientes) {
        if (usados.has(id)) continue;
        const ts = tarjetasData[id][campoDesde];
        const grupo = pendientes.filter(x => !usados.has(x) && Math.abs(tarjetasData[x][campoDesde] - ts) <= 2000);
        grupo.forEach(x => usados.add(x));
        grupos.push({ ts, ids: grupo });
      }
      return grupos;
    }

    function render() {
      const ids = Object.keys(tarjetasData);
      let html = '';
      ZONAS.forEach(zona => {
        const cajas = agruparEnCajas(ids, zona.desde, zona.hasta);
        const total = cajas.reduce((s,c)=>s+c.ids.length,0);
        const cajasHtml = cajas.length
          ? cajas.map(c => `
              <div class="caja" style="background:${zona.color}22;border-color:${zona.color}88;"
                data-zona="${zona.id}" data-ts="${c.ts}" data-ids="${c.ids.join(',')}"
                ontouchstart="touchStart(event)" ontouchmove="touchMove(event)" ontouchend="touchEnd(event)"
                draggable="true">
                <div class="caja-icon">📦</div>
                <div class="caja-num" style="color:${zona.color}">${c.ids.length} tarjeta${c.ids.length>1?'s':''}</div>
                <div class="caja-ids">#${c.ids.map(x=>tarjetasData[x].numero).sort((a,b)=>a-b).join(',')}</div>
              </div>`).join('')
          : '<span class="caja-vacia">Sin cajas</span>';

        html += `
          <div class="zona" id="zona-${zona.id}"
            ondragover="dragOver(event,'${zona.id}')" ondragleave="dragLeave('${zona.id}')"
            ondrop="drop(event,'${zona.id}')">
            <div class="zona-header">
              <div class="zona-dot" style="background:${zona.dotColor}"></div>
              <span class="zona-title">${zona.label}</span>
              <span class="zona-count">${total} tarjeta${total!==1?'s':''}</span>
            </div>
            <div class="cajas-wrap" id="cajas-${zona.id}">${cajasHtml}</div>
            <div style="font-size:0.62rem;color:#555;margin-top:6px">${zona.desc}</div>
          </div>`;
      });

      document.getElementById('pipeline').innerHTML = html;
      setupMouseDrag();
    }

    // ── MOVER CAJA ────────────────────────────────────────────────
    async function moverCaja(ids, zonaId) {
      const zona = ZONAS.find(z => z.id === zonaId);
      if (!zona) return;
      const ts = Date.now();
      const updates = {};
      ids.forEach(id => {
        updates[`sesiones/${sesion}/equipos/${equipo}/etapas/${etapaActual}/tarjetas/${id}/${zona.hasta}`] = ts;
      });
      await update(ref(db), updates);
      setStatus(`✅ ${ids.length} tarjeta${ids.length>1?'s':''} movida${ids.length>1?'s':''} a ${zona.label}`);
    }

    // ── DRAG MOUSE ────────────────────────────────────────────────
    let dragData = null;
    function setupMouseDrag() {
      document.querySelectorAll('.caja').forEach(el => {
        el.addEventListener('dragstart', e => {
          dragData = {
            zonaId: el.dataset.zona,
            ids: el.dataset.ids.split(',')
          };
          e.dataTransfer.effectAllowed = 'move';
        });
      });
    }
    window.dragOver = function(e, zonaId) {
      e.preventDefault();
      document.getElementById('zona-'+zonaId)?.classList.add('drop-over');
    };
    window.dragLeave = function(zonaId) {
      document.getElementById('zona-'+zonaId)?.classList.remove('drop-over');
    };
    window.drop = function(e, zonaId) {
      e.preventDefault();
      document.getElementById('zona-'+zonaId)?.classList.remove('drop-over');
      if (!dragData) return;
      // Solo permitir soltar en la zona correcta (siguiente)
      const zonaOrigen = ZONAS.find(z => z.id === dragData.zonaId);
      if (!zonaOrigen || zonaOrigen.id !== zonaId) {
        // Permitir soltar en cualquier zona pendiente
      }
      moverCaja(dragData.ids, zonaId);
      dragData = null;
    };

    // ── DRAG TOUCH ────────────────────────────────────────────────
    const ghost = document.getElementById('drag-ghost');
    let touchDragData = null;
    window.touchStart = function(e) {
      const el = e.currentTarget;
      touchDragData = { zonaId: el.dataset.zona, ids: el.dataset.ids.split(','), color: el.style.borderColor };
      ghost.style.background = ZONAS.find(z=>z.id===el.dataset.zona)?.color||'#17a2b8';
      ghost.innerHTML = '<div style="font-size:1.4rem">📦</div>';
      ghost.style.display = 'flex';
    };
    window.touchMove = function(e) {
      e.preventDefault();
      const t = e.touches[0];
      ghost.style.left = t.clientX+'px'; ghost.style.top = t.clientY+'px';
      document.querySelectorAll('.zona.drop-over').forEach(z=>z.classList.remove('drop-over'));
      const el = document.elementFromPoint(t.clientX, t.clientY);
      el?.closest('.zona')?.classList.add('drop-over');
    };
    window.touchEnd = function(e) {
      ghost.style.display = 'none';
      document.querySelectorAll('.zona.drop-over').forEach(z=>z.classList.remove('drop-over'));
      if (!touchDragData) return;
      const t = e.changedTouches[0];
      const zona = document.elementFromPoint(t.clientX, t.clientY)?.closest('.zona');
      if (zona) {
        const zonaId = zona.id.replace('zona-','');
        moverCaja(touchDragData.ids, zonaId);
      }
      touchDragData = null;
    };

    function setStatus(msg) {
      document.getElementById('status-msg').textContent = msg;
      setTimeout(()=>document.getElementById('status-msg').textContent='', 3000);
    }
  </script>
</body>
</html>
