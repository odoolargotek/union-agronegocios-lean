<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Materialista — Fábrica de Tarjetas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #eee;
           min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }
    .branding { display:flex; align-items:center; gap:8px; margin-bottom:10px; opacity:0.75; }
    .branding img { height:20px; filter:brightness(0) invert(1); }
    .branding span { font-size:0.62rem; color:#666; letter-spacing:1px; text-transform:uppercase; }
    h1 { font-size: 1.2rem; color: #17a2b8; text-align: center; margin-bottom: 4px; }
    .subtitle { font-size: 0.78rem; color: #aaa; margin-bottom: 20px; text-align: center; }
    .login-card { background: #161b22; border-radius: 12px; padding: 24px; width: 100%; max-width: 400px; }
    label { display: block; font-size: 0.78rem; color: #aaa; margin-bottom: 5px; }
    input, select { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid #30363d;
                    background: #0d1117; color: #fff; font-size: 0.95rem; margin-bottom: 14px; }
    button.primary { width: 100%; padding: 11px; border-radius: 8px; border: none;
                     background: #17a2b8; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
    #game-area { display: none; width: 100%; max-width: 560px; }
    .hud { display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
    .stage-badge { background:#161b22; border:1px solid #17a2b8; border-radius:20px;
                   padding:3px 12px; font-size:0.75rem; color:#17a2b8; }
    .equipo-chip { background:#161b22; border-radius:20px; padding:3px 12px; font-size:0.78rem; color:#aaa; }
    #status-msg { font-size:0.85rem; color:#17a2b8; text-align:center; min-height:18px; margin:4px 0 10px; }

    /* ── Bloques de color ── */
    .color-block { background:#161b22; border-radius:12px; padding:14px; margin-bottom:14px;
                   border:2px solid #30363d; }
    .color-block-header { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
    .color-dot { width:14px; height:14px; border-radius:50%; flex-shrink:0; }
    .color-title { font-size:0.9rem; font-weight:700; }
    .bandejas-row { display:grid; grid-template-columns:1fr 40px 1fr; gap:0; align-items:start; }
    .bandeja { border-radius:8px; padding:10px; min-height:72px; border:2px solid #30363d;
               transition:border 0.2s, background 0.2s; }
    .bandeja.entrada { background:#0d1117; }
    .bandeja.salida  { background:#0a1628; }
    .bandeja.drop-over { border-color:#17a2b8; background:#0d2530; }
    .bandeja-label { font-size:0.62rem; font-weight:700; text-transform:uppercase;
                     letter-spacing:0.5px; margin-bottom:6px; display:flex;
                     align-items:center; justify-content:space-between; }
    .bandeja-label .bl-icon { font-size:0.75rem; margin-right:3px; }
    .bandeja-count { font-size:0.62rem; background:#21262d; border-radius:8px; padding:1px 6px; color:#888; }
    .cajas-wrap { display:flex; flex-wrap:wrap; gap:6px; min-height:44px; align-items:flex-start; }
    .caja-vacia { color:#333; font-size:0.68rem; align-self:center; }

    /* Flecha central */
    .arrow-col { display:flex; align-items:center; justify-content:center; padding-top:28px; }
    .arrow-col span { font-size:1.4rem; color:#555; }

    /* Caja draggable */
    .caja { width:58px; height:58px; border-radius:8px; display:flex; flex-direction:column;
            align-items:center; justify-content:center; cursor:grab; touch-action:none;
            box-shadow:0 2px 8px rgba(0,0,0,0.5); border:2px solid rgba(255,255,255,0.12);
            transition:transform 0.1s, opacity 0.15s; user-select:none; }
    .caja:active { transform:scale(0.95); }
    .caja-icon { font-size:1.2rem; line-height:1; }
    .caja-num  { font-size:0.55rem; font-weight:700; color:#fff; margin-top:2px;
                 text-shadow:0 1px 3px rgba(0,0,0,0.6); }
    .caja-ids  { font-size:0.45rem; color:rgba(255,255,255,0.55); text-align:center; }

    /* Ghost touch */
    #drag-ghost { position:fixed; pointer-events:none; z-index:9999; width:58px; height:58px;
                  border-radius:8px; display:none; align-items:center; justify-content:center;
                  flex-direction:column; font-size:1.2rem; opacity:0.85;
                  transform:translate(-50%,-50%); box-shadow:0 4px 16px rgba(0,0,0,0.6); }
    .footer-brand { text-align:center; margin-top:24px; opacity:0.4; }
    .footer-brand img { height:14px; filter:brightness(0) invert(1); }
  </style>
</head>
<body>
  <div class="branding">
    <img src="https://www.largotek.com/web/image/website/2/logo/www.largotek.com?unique=d82f80f" alt="Largotek">
    <span>Largotek SRL</span>
  </div>
  <h1>📦 Materialista</h1>
  <p class="subtitle">Transporta cajas entre bandejas de salida → entrada</p>

  <div class="login-card" id="login-area">
    <label>Código de Sesión</label>
    <input type="text" id="inp-sesion" placeholder="Ej: LSS2026" maxlength="12">
    <label>Número de Equipo</label>
    <select id="inp-equipo">
      <option value="">-- Tu equipo --</option>
      <option value="1">Equipo 1</option><option value="2">Equipo 2</option>
      <option value="3">Equipo 3</option><option value="4">Equipo 4</option>
      <option value="5">Equipo 5</option><option value="6">Equipo 6</option>
    </select>
    <label>Tu nombre</label>
    <input type="text" id="inp-nombre" placeholder="Ej: María" maxlength="20">
    <button class="primary" onclick="entrar()">Entrar como Materialista</button>
  </div>

  <div id="game-area">
    <div class="hud">
      <div class="stage-badge" id="stage-badge">Etapa 1</div>
      <div class="equipo-chip" id="equipo-chip">Equipo —</div>
    </div>
    <div id="status-msg"></div>
    <div id="pipeline"></div>
  </div>

  <div class="footer-brand"><img src="https://www.largotek.com/web/image/website/2/logo/www.largotek.com?unique=d82f80f" alt="Largotek"></div>
  <div id="drag-ghost"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getDatabase, ref, set, onValue, update } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBJN55Mv4YCb2LKvQxrMU_lptAN6BCCx1c",
      authDomain: "union-agronegocios-lean.firebaseapp.com",
      databaseURL: "https://union-agronegocios-lean-default-rtdb.firebaseio.com",
      projectId: "union-agronegocios-lean",
      storageBucket: "union-agronegocios-lean.firebasestorage.app",
      messagingSenderId: "181432386406",
      appId: "1:181432386406:web:6804ed3af0e343cdc2bea7"
    };
    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);

    // Flujo: Amarillo → Naranja → Rojo → Verde → Calidad
    // El materialista mueve de salida_{color} a entrada_{siguiente}
    const FLUJO = [
      { color:'amarillo', label:'Amarillo', hex:'#f5c518',
        campoSalida:'salida_amarillo', campoEntradaSig:'entrada_naranja', siguiente:'naranja' },
      { color:'naranja',  label:'Naranja',  hex:'#e07800',
        campoSalida:'salida_naranja',  campoEntradaSig:'entrada_rojo',    siguiente:'rojo' },
      { color:'rojo',     label:'Rojo',     hex:'#e94560',
        campoSalida:'salida_rojo',     campoEntradaSig:'entrada_verde',   siguiente:'verde' },
      { color:'verde',    label:'Verde',    hex:'#1a8a3a',
        campoSalida:'salida_verde',    campoEntradaSig:'entrada_calidad', siguiente:'calidad' },
    ];

    let sesion, equipo, nombre, etapaActual = 1;
    let tarjetasData = {};

    window.entrar = function() {
      sesion = document.getElementById('inp-sesion').value.trim().toUpperCase();
      equipo = document.getElementById('inp-equipo').value;
      nombre = document.getElementById('inp-nombre').value.trim() || 'Materialista';
      if (!sesion||!equipo) { alert('Completa todos los campos.'); return; }
      document.getElementById('login-area').style.display = 'none';
      document.getElementById('game-area').style.display  = 'block';
      document.getElementById('equipo-chip').textContent  = 'Equipo ' + equipo;
      set(ref(db,`sesiones/${sesion}/equipos/${equipo}/jugadores/materialista`), { nombre, rol:'materialista', online:true });
      onValue(ref(db,`sesiones/${sesion}/etapaActiva`), snap => {
        etapaActual = snap.val()||1;
        document.getElementById('stage-badge').textContent = 'Etapa ' + etapaActual;
        escucharTarjetas();
      });
    };

    let listener = null;
    function escucharTarjetas() {
      if (listener) listener();
      listener = onValue(
        ref(db,`sesiones/${sesion}/equipos/${equipo}/etapas/${etapaActual}/tarjetas`),
        snap => { tarjetasData = snap.val()||{}; render(); }
      );
    }

    // Agrupa tarjetas que salieron juntas (mismo timestamp ±2s)
    function agruparPorTs(ids, campo) {
      const validos = ids.filter(id => tarjetasData[id][campo]);
      if (!validos.length) return [];
      const grupos = [];
      const usados = new Set();
      validos.sort((a,b) => tarjetasData[a][campo] - tarjetasData[b][campo]);
      for (const id of validos) {
        if (usados.has(id)) continue;
        const ts = tarjetasData[id][campo];
        const grupo = validos.filter(x => !usados.has(x) && Math.abs(tarjetasData[x][campo]-ts) <= 2000);
        grupo.forEach(x => usados.add(x));
        grupos.push({ ts, ids: grupo });
      }
      return grupos;
    }

    function render() {
      const ids = Object.keys(tarjetasData);
      let html = '';

      FLUJO.forEach(f => {
        // Bandeja SALIDA: tarjetas que el jugador envió pero aún no fueron movidas por el materialista
        const enSalida = agruparPorTs(
          ids.filter(id => tarjetasData[id][f.campoSalida] && !tarjetasData[id][f.campoEntradaSig]),
          f.campoSalida
        );
        // Bandeja ENTRADA del SIGUIENTE: tarjetas que el materialista ya movió
        const enEntrada = agruparPorTs(
          ids.filter(id => tarjetasData[id][f.campoEntradaSig]),
          f.campoEntradaSig
        );

        const totalSalida  = enSalida.reduce((s,c)=>s+c.ids.length,0);
        const totalEntrada = enEntrada.reduce((s,c)=>s+c.ids.length,0);
        const siguienteLabel = f.siguiente.charAt(0).toUpperCase()+f.siguiente.slice(1);

        const cajasHtmlSalida = enSalida.length
          ? enSalida.map(c => cajaDom(c, f, 'salida')).join('')
          : '<span class="caja-vacia">Vacía</span>';

        const cajasHtmlEntrada = enEntrada.length
          ? enEntrada.map(c => cajaDom(c, f, 'entrada')).join('')
          : '<span class="caja-vacia">Vacía</span>';

        html += `
          <div class="color-block" id="block-${f.color}">
            <div class="color-block-header">
              <div class="color-dot" style="background:${f.hex}"></div>
              <span class="color-title" style="color:${f.hex}">${f.label}</span>
              <span style="font-size:0.68rem;color:#555;margin-left:auto">arrastra de Salida → Entrada ${siguienteLabel}</span>
            </div>
            <div class="bandejas-row">
              <!-- SALIDA -->
              <div class="bandeja salida" id="salida-${f.color}">
                <div class="bandeja-label" style="color:${f.hex}">
                  <span><span class="bl-icon">📤</span>Salida ${f.label}</span>
                  <span class="bandeja-count">${totalSalida}</span>
                </div>
                <div class="cajas-wrap" id="cajas-salida-${f.color}">${cajasHtmlSalida}</div>
              </div>
              <!-- Flecha -->
              <div class="arrow-col"><span>→</span></div>
              <!-- ENTRADA SIGUIENTE -->
              <div class="bandeja entrada" id="entrada-${f.siguiente}"
                ondragover="dragOver(event,'entrada-${f.siguiente}')"
                ondragleave="dragLeave('entrada-${f.siguiente}')"
                ondrop="drop(event,'entrada-${f.siguiente}','${f.color}')">
                <div class="bandeja-label" style="color:#aaa">
                  <span><span class="bl-icon">📥</span>Entrada ${siguienteLabel}</span>
                  <span class="bandeja-count">${totalEntrada}</span>
                </div>
                <div class="cajas-wrap" id="cajas-entrada-${f.siguiente}">${cajasHtmlEntrada}</div>
              </div>
            </div>
          </div>`;
      });

      document.getElementById('pipeline').innerHTML = html || '<p style="color:#555">Sin tarjetas aún.</p>';
      setupMouseDrag();
    }

    function cajaDom(c, f, tipo) {
      // Solo las cajas en SALIDA son arrastrables
      const draggable = tipo === 'salida';
      const nums = c.ids.map(x=>tarjetasData[x]?.numero).filter(Boolean).sort((a,b)=>a-b);
      return `<div class="caja" style="background:${f.hex}22;border-color:${f.hex}55;"
        ${draggable ? `data-color="${f.color}" data-ids="${c.ids.join(',')}" draggable="true"
        ontouchstart="touchStart(event)" ontouchmove="touchMove(event)" ontouchend="touchEnd(event)"` : ''}
        >
        <div class="caja-icon">📦</div>
        <div class="caja-num" style="color:${f.hex}">${c.ids.length} tarj.</div>
        <div class="caja-ids">#${nums.join(',')}</div>
      </div>`;
    }

    // ── MOVER CAJA ──
    async function moverCaja(ids, colorOrigen, destinoEl) {
      const f = FLUJO.find(x => x.color === colorOrigen);
      if (!f) return;
      // Optimistic: mover visualmente al instante
      const origenWrap  = document.getElementById(`cajas-salida-${colorOrigen}`);
      const destinoWrap = document.getElementById(`cajas-entrada-${f.siguiente}`);
      if (origenWrap && destinoWrap && destinoEl) {
        const cajaEl = destinoEl.closest('.caja');
        if (cajaEl) {
          const clone = cajaEl.cloneNode(true);
          clone.removeAttribute('draggable');
          clone.style.cursor = 'default';
          // Quitar listeners
          const fresh = clone.cloneNode(true);
          const vacia = destinoWrap.querySelector('.caja-vacia');
          if (vacia) vacia.remove();
          destinoWrap.appendChild(fresh);
          cajaEl.remove();
          if (!origenWrap.children.length) origenWrap.innerHTML = '<span class="caja-vacia">Vacía</span>';
          // Actualizar contadores
          const sc = document.querySelector(`#salida-${colorOrigen} .bandeja-count`);
          const ec = document.querySelector(`#entrada-${f.siguiente} .bandeja-count`);
          if (sc) { const v=Math.max(0,(parseInt(sc.textContent)||0)-ids.length); sc.textContent=v; }
          if (ec) { const v=(parseInt(ec.textContent)||0)+ids.length; ec.textContent=v; }
        }
      }
      // Escribir en Firebase
      const ts = Date.now();
      const updates = {};
      ids.forEach(id => {
        updates[`sesiones/${sesion}/equipos/${equipo}/etapas/${etapaActual}/tarjetas/${id}/${f.campoEntradaSig}`] = ts;
      });
      await update(ref(db), updates);
      setStatus(`✅ ${ids.length} tarjeta${ids.length>1?'s':''} movida${ids.length>1?'s':''} → Entrada ${f.siguiente.charAt(0).toUpperCase()+f.siguiente.slice(1)}`);
    }

    // ── DRAG MOUSE ──
    let dragData = null;
    function setupMouseDrag() {
      document.querySelectorAll('.caja[draggable]').forEach(el => {
        el.addEventListener('dragstart', e => {
          dragData = { color: el.dataset.color, ids: el.dataset.ids.split(','), el };
          e.dataTransfer.effectAllowed = 'move';
        });
      });
    }
    window.dragOver  = (e, id) => { e.preventDefault(); document.getElementById(id)?.classList.add('drop-over'); };
    window.dragLeave = id      => { document.getElementById(id)?.classList.remove('drop-over'); };
    window.drop = function(e, zonaId, colorOrigen) {
      e.preventDefault();
      document.getElementById(zonaId)?.classList.remove('drop-over');
      if (!dragData || dragData.color !== colorOrigen) {
        setStatus('⚠️ Solo puedes mover de Salida a la Entrada del siguiente color.');
        dragData = null; return;
      }
      moverCaja(dragData.ids, dragData.color, dragData.el);
      dragData = null;
    };

    // ── DRAG TOUCH ──
    const ghost = document.getElementById('drag-ghost');
    let touchDragData = null;
    window.touchStart = function(e) {
      const el = e.currentTarget;
      touchDragData = { color: el.dataset.color, ids: el.dataset.ids.split(','), el };
      const f = FLUJO.find(x => x.color === el.dataset.color);
      ghost.style.background = f?.hex || '#17a2b8';
      ghost.innerHTML = '<div style="font-size:1.2rem">📦</div>';
      ghost.style.display = 'flex';
    };
    window.touchMove = function(e) {
      e.preventDefault();
      const t = e.touches[0];
      ghost.style.left = t.clientX+'px'; ghost.style.top = t.clientY+'px';
      document.querySelectorAll('.bandeja.drop-over').forEach(z=>z.classList.remove('drop-over'));
      document.elementFromPoint(t.clientX,t.clientY)?.closest('.bandeja.entrada')?.classList.add('drop-over');
    };
    window.touchEnd = function(e) {
      ghost.style.display = 'none';
      document.querySelectorAll('.bandeja.drop-over').forEach(z=>z.classList.remove('drop-over'));
      if (!touchDragData) return;
      const t = e.changedTouches[0];
      const bandeja = document.elementFromPoint(t.clientX,t.clientY)?.closest('.bandeja.entrada');
      if (bandeja) {
        const zonaId = bandeja.id; // entrada-{color}
        const colorDestino = zonaId.replace('entrada-','');
        const f = FLUJO.find(x => x.siguiente === colorDestino);
        if (f && f.color === touchDragData.color) {
          moverCaja(touchDragData.ids, touchDragData.color, touchDragData.el);
        } else {
          setStatus('⚠️ Solo puedes mover de Salida a la Entrada del siguiente color.');
        }
      }
      touchDragData = null;
    };

    function setStatus(msg) {
      document.getElementById('status-msg').textContent = msg;
      setTimeout(()=>document.getElementById('status-msg').textContent='',3000);
    }
  </script>
</body>
</html>
