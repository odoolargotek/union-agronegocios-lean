<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fábrica de Tarjetas — Jugador</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }
    h1 { font-size: 1.3rem; color: #f0c040; text-align: center; margin-bottom: 4px; }
    .subtitle { font-size: 0.8rem; color: #aaa; margin-bottom: 20px; text-align: center; }

    /* LOGIN */
    .login-card { background: #16213e; border-radius: 12px; padding: 24px; width: 100%; max-width: 420px; box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
    label { display: block; font-size: 0.78rem; color: #aaa; margin-bottom: 5px; }
    input, select { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid #333; background: #0f3460; color: #fff; font-size: 0.95rem; margin-bottom: 14px; }
    button.primary { width: 100%; padding: 11px; border-radius: 8px; border: none; background: #e94560; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button.primary:hover { background: #c73652; }

    /* HUD */
    #game-area { display: none; width: 100%; max-width: 480px; }
    .hud { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .stage-badge { background: #0f3460; border: 1px solid #e94560; border-radius: 20px; padding: 3px 12px; font-size: 0.75rem; color: #f0c040; }
    .rol-chip { display: flex; align-items: center; gap: 6px; background: #0f3460; border-radius: 20px; padding: 3px 12px; font-size: 0.8rem; font-weight: 600; }
    .cdot { width: 14px; height: 14px; border-radius: 50%; }
    .metrics-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .metric { flex: 1; background: #0f3460; border-radius: 8px; padding: 8px; text-align: center; }
    .metric .val { font-size: 1.3rem; font-weight: 700; color: #f0c040; }
    .metric .lbl { font-size: 0.65rem; color: #aaa; }
    .lote-info { background: #0a1628; border-radius: 8px; padding: 8px 12px; font-size: 0.78rem; color: #aaa; margin-bottom: 14px; }
    .lote-info b { color: #f0c040; }
    #status-msg { font-size: 0.85rem; color: #f0c040; text-align: center; min-height: 18px; margin: 6px 0; }
    #waiting-msg { text-align: center; color: #aaa; padding: 30px 0; font-size: 0.9rem; }

    /* PROGRESS BAR lote */
    .lote-progress { display: flex; gap: 4px; margin-bottom: 14px; }
    .lp-dot { flex: 1; height: 6px; border-radius: 3px; background: #0f3460; transition: background 0.3s; }
    .lp-dot.done { background: #28a745; }
    .lp-dot.active { background: #f0c040; }

    /* TARJETA PAPEL */
    .paper-card {
      background: #fffef0;
      border-radius: 8px;
      box-shadow: 2px 3px 12px rgba(0,0,0,0.5), inset 0 0 0 1px #ddd;
      padding: 14px 14px 10px;
      margin-bottom: 14px;
      position: relative;
      color: #222;
      user-select: none;
    }
    .paper-card .card-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #ccc; padding-bottom: 6px; margin-bottom: 10px;
    }
    .paper-card .card-num { font-size: 0.75rem; font-weight: 700; color: #444; }
    .paper-card .card-logo { font-size: 0.65rem; color: #888; font-style: italic; }
    .paper-card .card-estado {
      font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 10px;
      background: #eee; color: #666;
    }
    .paper-card .card-estado.aprobada { background: #d4edda; color: #155724; }
    .paper-card .card-estado.revision { background: #fff3cd; color: #856404; }
    .paper-card .card-estado.rechazada { background: #f8d7da; color: #721c24; }

    /* FILAS DE POSICIONES */
    .etiqueta-fila { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .etiqueta-fila .fila-label { font-size: 0.65rem; color: #999; width: 14px; text-align: right; flex-shrink: 0; }
    .drop-zone {
      width: 52px; height: 28px; border-radius: 5px; border: 2px dashed #ccc;
      background: #f5f5f0; display: flex; align-items: center; justify-content: center;
      font-size: 0.6rem; color: #bbb; position: relative; transition: border 0.2s, background 0.2s;
      flex-shrink: 0;
    }
    .drop-zone.over { border-color: #e94560; background: #fff0f3; }
    .drop-zone.filled { border-style: solid; border-color: transparent; background: transparent; }
    .drop-zone .etiqueta-pegada {
      width: 100%; height: 100%; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.55rem; font-weight: 700; color: #fff; letter-spacing: 0.5px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
      position: relative;
    }
    .score-badge {
      position: absolute; top: -7px; right: -7px;
      background: #222; color: #fff; border-radius: 8px;
      font-size: 0.5rem; padding: 1px 4px; font-weight: 700;
    }
    .score-badge.perfect { background: #28a745; }
    .score-badge.ok { background: #d29922; }
    .score-badge.bad { background: #e94560; }

    /* ETIQUETA DRAGGABLE */
    .drag-area { margin-top: 10px; border-top: 1px dashed #ccc; padding-top: 10px; }
    .drag-area .da-label { font-size: 0.7rem; color: #888; margin-bottom: 6px; text-align: center; }
    .draggable-etiqueta {
      width: 64px; height: 34px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; font-weight: 700; color: #fff;
      cursor: grab; margin: 0 auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
      touch-action: none;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .draggable-etiqueta:active { cursor: grabbing; transform: scale(1.08); box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
    .draggable-etiqueta.agotada { opacity: 0.4; cursor: not-allowed; }

    /* CALIDAD */
    .calidad-panel { background: #fffef0; border-radius: 8px; padding: 12px; margin-bottom: 10px; color: #222; border: 2px solid #f0c040; }
    .calidad-panel h3 { font-size: 0.85rem; color: #333; margin-bottom: 8px; }
    .calidad-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #eee; font-size: 0.8rem; }
    .calidad-item:last-child { border-bottom: none; }
    .calidad-btns { display: flex; gap: 6px; }
    .btn-aprobar { padding: 4px 10px; border-radius: 6px; border: none; background: #28a745; color: #fff; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
    .btn-rechazar { padding: 4px 10px; border-radius: 6px; border: none; background: #e94560; color: #fff; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
    .score-pill { font-size: 0.7rem; padding: 2px 7px; border-radius: 10px; font-weight: 700; }

    /* GHOST drag */
    #drag-ghost {
      position: fixed; pointer-events: none; z-index: 9999;
      width: 58px; height: 30px; border-radius: 5px;
      display: none; align-items: center; justify-content: center;
      font-size: 0.6rem; font-weight: 700; color: #fff;
      opacity: 0.85; transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <h1>🏭 Fábrica de Tarjetas</h1>
  <p class="subtitle">Unión Agronegocios — Lean White Belt</p>

  <div class="login-card" id="login-area">
    <label>Código de Sesión</label>
    <input type="text" id="inp-sesion" placeholder="Ej: LSS2026" maxlength="12">
    <label>Número de Equipo</label>
    <select id="inp-equipo">
      <option value="">-- Tu equipo --</option>
      <option value="1">Equipo 1</option><option value="2">Equipo 2</option>
      <option value="3">Equipo 3</option><option value="4">Equipo 4</option>
      <option value="5">Equipo 5</option><option value="6">Equipo 6</option>
    </select>
    <label>Tu Rol</label>
    <select id="inp-rol">
      <option value="">-- Tu rol --</option>
      <option value="amarillo">🟡 Amarillo (2 etiquetas/tarjeta)</option>
      <option value="naranja">🟠 Naranja (1 etiqueta/tarjeta)</option>
      <option value="rojo">🔴 Rojo (3 etiquetas/tarjeta)</option>
      <option value="verde">🟢 Verde (2 etiquetas/tarjeta)</option>
      <option value="calidad">🔍 Calidad / Inspector</option>
    </select>
    <label>Tu nombre</label>
    <input type="text" id="inp-nombre" placeholder="Ej: Juan" maxlength="20">
    <button class="primary" onclick="entrar()">Entrar al juego</button>
  </div>

  <div id="game-area">
    <div class="hud">
      <div class="stage-badge" id="stage-info">Etapa 1</div>
      <div class="rol-chip"><div class="cdot" id="color-dot"></div><span id="rol-nombre">—</span></div>
      <span style="margin-left:auto;font-size:0.72rem;color:#888" id="equipo-display"></span>
    </div>
    <div class="lote-info" id="lote-info">Cargando...</div>
    <div class="lote-progress" id="lote-progress"></div>
    <div class="metrics-row">
      <div class="metric"><div class="val" id="m-entregadas">0</div><div class="lbl">Entregadas</div></div>
      <div class="metric"><div class="val" id="m-wip">0</div><div class="lbl">WIP</div></div>
      <div class="metric"><div class="val" id="m-defectos">0</div><div class="lbl">Defectos</div></div>
    </div>
    <div id="status-msg"></div>
    <div id="tarjetas-container"><div id="waiting-msg">⏳ Esperando inicio de etapa...</div></div>
  </div>

  <!-- Ghost para drag visual -->
  <div id="drag-ghost"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getDatabase, ref, set, onValue, update, get } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBJN55Mv4YCb2LKvQxrMU_lptAN6BCCx1c",
      authDomain: "union-agronegocios-lean.firebaseapp.com",
      databaseURL: "https://union-agronegocios-lean-default-rtdb.firebaseio.com",
      projectId: "union-agronegocios-lean",
      storageBucket: "union-agronegocios-lean.firebasestorage.app",
      messagingSenderId: "181432386406",
      appId: "1:181432386406:web:6804ed3af0e343cdc2bea7"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ── CONSTANTES ──────────────────────────────────────────────
    const COLORES = { amarillo:'#f5c518', naranja:'#e07800', rojo:'#e94560', verde:'#1a8a3a', calidad:'#6f42c1' };

    // Layout de posiciones en la tarjeta: [color, col, row] — 4 columnas, 3 filas
    // Fila 0: amarillo x2 | Fila 1: naranja x1, rojo x2 | Fila 2: rojo x1, verde x2
    const POSICIONES = [
      { id:'a1', color:'amarillo', col:0, row:0 },
      { id:'a2', color:'amarillo', col:1, row:0 },
      { id:'n1', color:'naranja',  col:2, row:0 },
      { id:'r1', color:'rojo',     col:3, row:0 },
      { id:'r2', color:'rojo',     col:0, row:1 },
      { id:'r3', color:'rojo',     col:1, row:1 },
      { id:'v1', color:'verde',    col:2, row:1 },
      { id:'v2', color:'verde',    col:3, row:1 },
    ];
    // Cuántas etiquetas por color
    const CANTIDAD = { amarillo:2, naranja:1, rojo:3, verde:2 };

    const LOTE_CONFIG = {
      1: { lote:4, nombre:'Etapa 1 — Lote de 4', desc:'Pega tus etiquetas en <b>4 tarjetas</b> antes de pasarlas.' },
      2: { lote:2, nombre:'Etapa 2 — Lote de 2', desc:'Pega tus etiquetas en <b>2 tarjetas</b> y pasa.' },
      3: { lote:1, nombre:'Etapa 3 — Flujo unitario', desc:'Pega tu etiqueta en <b>1 tarjeta</b> y pasa inmediatamente.' }
    };

    // Umbral de precisión (px)
    const UMBRAL_OK = 18;       // ≤18px → ≥85% → perfecto
    const UMBRAL_MARGINAL = 35; // ≤35px → marginal
    // > 35px → defecto automático

    let sesion, equipo, rol, nombre;
    let etapaActual = 1;
    let tarjetasListener = null;
    let tarjetasData = {};
    // Para drag
    let dragTarjetaId = null;
    let dragPosId = null;

    // ── LOGIN ────────────────────────────────────────────────────
    window.entrar = function() {
      sesion = document.getElementById('inp-sesion').value.trim().toUpperCase();
      equipo = document.getElementById('inp-equipo').value;
      rol    = document.getElementById('inp-rol').value;
      nombre = document.getElementById('inp-nombre').value.trim() || rol;
      if (!sesion||!equipo||!rol) { alert('Completa todos los campos.'); return; }

      document.getElementById('login-area').style.display = 'none';
      document.getElementById('game-area').style.display  = 'block';
      document.getElementById('color-dot').style.background = COLORES[rol]||'#888';
      document.getElementById('rol-nombre').textContent = nombre;
      document.getElementById('equipo-display').textContent = 'Equipo ' + equipo;

      set(ref(db,`sesiones/${sesion}/equipos/${equipo}/jugadores/${rol}`), { nombre, rol, online:true });

      onValue(ref(db,`sesiones/${sesion}/etapaActiva`), snap => {
        etapaActual = snap.val() || 1;
        actualizarHUD();
        escucharTarjetas();
      });
      onValue(ref(db,`sesiones/${sesion}/equipos/${equipo}/metricas`), snap => {
        const m = snap.val()||{};
        document.getElementById('m-entregadas').textContent = m.entregadas||0;
        document.getElementById('m-wip').textContent        = m.wip||0;
        document.getElementById('m-defectos').textContent   = m.defectos||0;
      });
    };

    function actualizarHUD() {
      const cfg = LOTE_CONFIG[etapaActual]||LOTE_CONFIG[1];
      document.getElementById('stage-info').textContent = cfg.nombre;
      document.getElementById('lote-info').innerHTML = cfg.desc;
    }

    function escucharTarjetas() {
      if (tarjetasListener) tarjetasListener();
      const r = ref(db,`sesiones/${sesion}/equipos/${equipo}/etapas/${etapaActual}/tarjetas`);
      tarjetasListener = onValue(r, snap => {
        tarjetasData = snap.val()||{};
        render();
      });
    }

    // ── RENDER PRINCIPAL ─────────────────────────────────────────
    function render() {
      const container = document.getElementById('tarjetas-container');
      const ids = Object.keys(tarjetasData);
      if (!ids.length) {
        container.innerHTML = '<div id="waiting-msg">⏳ Esperando que el instructor inicie la etapa...</div>';
        document.getElementById('lote-progress').innerHTML = '';
        return;
      }

      const lote = LOTE_CONFIG[etapaActual]?.lote || 4;

      if (rol === 'calidad') {
        renderCalidad(container, ids);
        return;
      }

      // Para operarios: mostrar lote actual (primeras N tarjetas sin mis etiquetas completadas)
      const misPendientes = ids.filter(id => {
        const t = tarjetasData[id];
        if (t.aprobada || t.rechazada) return false;
        // Contar cuántas de mis posiciones ya están pegadas en esta tarjeta
        const misPosiciones = POSICIONES.filter(p => p.color === rol);
        const pegadas = misPosiciones.filter(p => t[p.id] !== undefined).length;
        return pegadas < misPosiciones.length;
      });

      const loteTarjetas = misPendientes.slice(0, lote);

      // Progress bar del lote
      const progHtml = Array.from({length: lote}, (_, i) =>
        `<div class="lp-dot ${i < loteTarjetas.length ? (tarjetasData[loteTarjetas[i]]?.[POSICIONES.find(p=>p.color===rol)?.id] !== undefined ? 'done' : 'active') : ''}"></div>`
      ).join('');
      document.getElementById('lote-progress').innerHTML = progHtml;

      if (!loteTarjetas.length) {
        container.innerHTML = '<div id="waiting-msg">✅ Lote completado, espera al materialista...</div>';
        return;
      }

      container.innerHTML = loteTarjetas.map(id => renderTarjeta(id, tarjetasData[id])).join('');
      setupDropZones();
    }

    function renderTarjeta(id, t) {
      const misPosiciones = POSICIONES.filter(p => p.color === rol);
      const pegadasMias = misPosiciones.filter(p => t[p.id] !== undefined).length;
      const todasPegadas = POSICIONES.every(p => t[p.id] !== undefined);
      const estadoLabel = t.aprobada ? 'aprobada' : t.rechazada ? 'rechazada' :
                          todasPegadas ? 'revision' : '';
      const estadoTxt   = t.aprobada ? '✅ Aprobada' : t.rechazada ? '❌ Defecto' :
                          todasPegadas ? '🔍 En revisión' : '';

      // Agrupar posiciones por fila
      const filas = [0,1].map(row => POSICIONES.filter(p => p.row === row));

      let filasHtml = filas.map(fila => {
        const zonas = fila.map(pos => {
          const pegada = t[pos.id];
          if (pegada !== undefined) {
            const scoreNum = pegada.score || 0;
            const scoreClass = scoreNum >= 85 ? 'perfect' : scoreNum >= 60 ? 'ok' : 'bad';
            return `<div class="drop-zone filled" data-pos="${pos.id}" data-tid="${id}">
              <div class="etiqueta-pegada" style="background:${COLORES[pos.color]}">
                ${pegada.nombre ? pegada.nombre.substring(0,3).toUpperCase() : pos.color.substring(0,2).toUpperCase()}
                <span class="score-badge ${scoreClass}">${scoreNum}%</span>
              </div>
            </div>`;
          }
          // Zona vacía — solo mi color puede hacer drop
          const esMio = pos.color === rol;
          return `<div class="drop-zone${esMio?' mia':''}" data-pos="${pos.id}" data-tid="${id}" data-color="${pos.color}"
            style="${esMio ? 'border-color:#'+COLORES[rol].replace('#','')+';' : ''}">
            ${esMio ? '<span style="font-size:0.55rem;color:'+COLORES[rol]+'">drop</span>' : ''}
          </div>`;
        }).join('');
        return `<div class="etiqueta-fila">${zonas}</div>`;
      }).join('');

      // Etiqueta draggable (solo si me quedan posiciones)
      const meFalta = misPosiciones.some(p => t[p.id] === undefined);
      const dragHtml = meFalta && !t.aprobada && !t.rechazada ? `
        <div class="drag-area">
          <div class="da-label">Arrastra tu etiqueta ↓</div>
          <div class="draggable-etiqueta" id="drag-${id}"
            style="background:${COLORES[rol]}"
            draggable="true"
            data-tid="${id}"
            ontouchstart="touchStart(event)"
            ontouchmove="touchMove(event)"
            ontouchend="touchEnd(event)">
            ${nombre.substring(0,4).toUpperCase()}
          </div>
        </div>` : '';

      return `<div class="paper-card" id="pc-${id}">
        <div class="card-header">
          <span class="card-num">TARJETA #${t.numero}</span>
          <span class="card-logo">UA Lean</span>
          ${estadoLabel ? `<span class="card-estado ${estadoLabel}">${estadoTxt}</span>` : ''}
        </div>
        ${filasHtml}
        ${dragHtml}
      </div>`;
    }

    // ── CALIDAD VIEW ─────────────────────────────────────────────
    function renderCalidad(container, ids) {
      const enRevision = ids.filter(id => {
        const t = tarjetasData[id];
        return POSICIONES.every(p => t[p.id] !== undefined) && !t.aprobada && !t.rechazada;
      });
      if (!enRevision.length) {
        container.innerHTML = '<div id="waiting-msg">🔍 Sin tarjetas en revisión aún...</div>';
        return;
      }
      const items = enRevision.map(id => {
        const t = tarjetasData[id];
        const scores = POSICIONES.map(p => t[p.id]?.score || 0);
        const avg = Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
        const cls = avg>=85?'perfect':avg>=60?'ok':'bad';
        return `<div class="calidad-item">
          <span>Tarjeta #${t.numero}</span>
          <span class="score-pill" style="background:${cls==='perfect'?'#28a745':cls==='ok'?'#d29922':'#e94560'};color:#fff">Score ${avg}%</span>
          <div class="calidad-btns">
            <button class="btn-aprobar" onclick="decidirCalidad('${id}',true,${avg})">✅ OK</button>
            <button class="btn-rechazar" onclick="decidirCalidad('${id}',false,${avg})">❌ NG</button>
          </div>
        </div>`;
      }).join('');
      container.innerHTML = `<div class="calidad-panel"><h3>🔍 Tarjetas en revisión (${enRevision.length})</h3>${items}</div>`;
    }

    window.decidirCalidad = async function(tarjetaId, aprobada, score) {
      const path = `sesiones/${sesion}/equipos/${equipo}/etapas/${etapaActual}/tarjetas/${tarjetaId}`;
      const updates = {};
      updates[`${path}/aprobada`]  = aprobada;
      updates[`${path}/rechazada`] = !aprobada;
      updates[`${path}/scorePromedio`] = score;
      if (aprobada) {
        const snap = await get(ref(db,`sesiones/${sesion}/equipos/${equipo}/metricas/entregadas`));
        updates[`sesiones/${sesion}/equipos/${equipo}/metricas/entregadas`] = (snap.val()||0)+1;
      } else {
        const snap = await get(ref(db,`sesiones/${sesion}/equipos/${equipo}/metricas/defectos`));
        updates[`sesiones/${sesion}/equipos/${equipo}/metricas/defectos`] = (snap.val()||0)+1;
      }
      await update(ref(db), updates);
      setStatus(aprobada ? '✅ Tarjeta aprobada' : '❌ Tarjeta rechazada — defecto registrado');
    };

    // ── DRAG & DROP (mouse) ──────────────────────────────────────
    function setupDropZones() {
      document.querySelectorAll('.draggable-etiqueta').forEach(el => {
        el.addEventListener('dragstart', e => {
          dragTarjetaId = el.dataset.tid;
          e.dataTransfer.effectAllowed = 'move';
        });
      });
      document.querySelectorAll('.drop-zone.mia').forEach(zone => {
        zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
        zone.addEventListener('dragleave', () => zone.classList.remove('over'));
        zone.addEventListener('drop', e => {
          e.preventDefault();
          zone.classList.remove('over');
          const posId = zone.dataset.pos;
          const tid   = zone.dataset.tid;
          pegarEtiqueta(tid, posId, e.clientX, e.clientY, zone);
        });
      });
    }

    // ── DRAG & DROP (touch) ──────────────────────────────────────
    let touchEl = null;
    const ghost = document.getElementById('drag-ghost');

    window.touchStart = function(e) {
      touchEl = e.currentTarget;
      dragTarjetaId = touchEl.dataset.tid;
      ghost.style.background = COLORES[rol];
      ghost.textContent = nombre.substring(0,4).toUpperCase();
      ghost.style.display = 'flex';
    };
    window.touchMove = function(e) {
      e.preventDefault();
      const t = e.touches[0];
      ghost.style.left = t.clientX + 'px';
      ghost.style.top  = t.clientY + 'px';
      // Highlight zona debajo
      document.querySelectorAll('.drop-zone.over').forEach(z => z.classList.remove('over'));
      const el = document.elementFromPoint(t.clientX, t.clientY);
      const zone = el?.closest('.drop-zone.mia');
      if (zone) zone.classList.add('over');
    };
    window.touchEnd = function(e) {
      ghost.style.display = 'none';
      const t = e.changedTouches[0];
      document.querySelectorAll('.drop-zone.over').forEach(z => z.classList.remove('over'));
      const el = document.elementFromPoint(t.clientX, t.clientY);
      const zone = el?.closest('.drop-zone.mia');
      if (zone) {
        pegarEtiqueta(zone.dataset.tid, zone.dataset.pos, t.clientX, t.clientY, zone);
      }
      touchEl = null;
    };

    // ── PEGAR ETIQUETA CON SCORE ─────────────────────────────────
    async function pegarEtiqueta(tarjetaId, posId, dropX, dropY, zoneEl) {
      // Calcular score de precisión
      const rect = zoneEl.getBoundingClientRect();
      const cx = rect.left + rect.width/2;
      const cy = rect.top  + rect.height/2;
      const dist = Math.sqrt((dropX-cx)**2 + (dropY-cy)**2);
      let score;
      if (dist <= UMBRAL_OK)       score = Math.round(100 - (dist/UMBRAL_OK)*15);        // 85–100%
      else if (dist <= UMBRAL_MARGINAL) score = Math.round(85 - ((dist-UMBRAL_OK)/(UMBRAL_MARGINAL-UMBRAL_OK))*25); // 60–84%
      else score = Math.max(0, Math.round(60 - ((dist-UMBRAL_MARGINAL)/20)*60));          // 0–59%

      const path = `sesiones/${sesion}/equipos/${equipo}/etapas/${etapaActual}/tarjetas/${tarjetaId}`;
      const updates = {};
      updates[`${path}/${posId}`] = { score, nombre, rol, ts: Date.now() };

      // ¿Todas las posiciones llenas?
      const snap = await get(ref(db, path));
      const t = snap.val()||{};
      const todasLlenas = POSICIONES.every(p => p.id === posId ? true : t[p.id] !== undefined);
      if (todasLlenas) {
        updates[`${path}/pendienteCalidad`] = true;
      }

      await update(ref(db), updates);

      const emoji = score>=85 ? '🎯' : score>=60 ? '⚠️' : '💥';
      setStatus(`${emoji} Score de precisión: ${score}%`);
    }

    function setStatus(msg) {
      document.getElementById('status-msg').textContent = msg;
      setTimeout(() => document.getElementById('status-msg').textContent = '', 3000);
    }
  </script>
</body>
